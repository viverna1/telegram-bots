[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bots"
version = "1.0.0"
description = "Telegram bots"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "v-v" }
]
dependencies = [
    "aiogram>=3.31.0",
    "python-dotenv>=1.0",
    "requests>=2.34",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-mock",
]

[tool.setuptools]
packages = ["core"]
py-modules = ["run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]